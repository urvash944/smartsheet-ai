# Name of our backend app
spring.application.name=backend

# The port our backend runs on
server.port=8080

# Maximum size of an uploaded file (protects the server from huge uploads)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# PRIVACY: keep uploaded files in memory only, never write them to disk.
# Files up to this size stay in memory. Since our max upload is 5MB,
# every upload stays in memory and is gone when the request ends.
spring.servlet.multipart.file-size-threshold=5MB