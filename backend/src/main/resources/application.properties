# Load secrets from the .env file in the backend folder (if it exists).
# Online there is no .env file; Render provides the values instead.
spring.config.import=optional:file:.env[.properties]

# Basic settings
spring.application.name=backend

# Render tells us which port to use through the PORT variable.
# On your computer PORT is not set, so 8080 is used.
server.port=${PORT:8080}

# Upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# PRIVACY: keep uploads in memory only, never write them to disk
spring.servlet.multipart.file-size-threshold=5MB

# Gemini AI (values come from .env or the hosting settings, never written here)
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-flash-lite-latest}

# Which website(s) may call this backend from a browser (CORS).
# Several sites can be separated by commas. Default = local React app.
app.frontend-url=${FRONTEND_URL:http://localhost:5173}