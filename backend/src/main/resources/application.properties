# Load secrets from the .env file in the backend folder (if it exists)
spring.config.import=optional:file:.env[.properties]

# Basic settings
spring.application.name=backend
server.port=8080

# Upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# PRIVACY: keep uploads in memory only, never write them to disk
spring.servlet.multipart.file-size-threshold=5MB

# Gemini AI (values come from .env, never write the real key here)
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-flash-lite-latest}